{% extends 'core/base.html' %}

{% block title %}Device Data{% endblock %}

{% block content %}
  <h2>Data for Device: {{ device_id }}</h2>

  <div id="device-data">
    <p>Loading latest data...</p>
  </div>

  <br>
  <a href="{% url 'dashboard' %}" class="btn-primary">Back to Dashboard</a>

  <script>
    function fetchDeviceData() {
      fetch("{% url 'device_data_json' device_id %}")
        .then(response => response.json())
        .then(data => {
          if (data.nitrogen !== undefined) {
            document.getElementById("device-data").innerHTML = `
              <table class="device-table">
                <tr><th>N</th><td>${data.nitrogen}</td></tr>
                <tr><th>P</th><td>${data.phosphorus}</td></tr>
                <tr><th>K</th><td>${data.potassium}</td></tr>
                <tr><th>TEMP</th><td>${data.temperature}</td></tr>
                <tr><th>HUM</th><td>${data.humidity}</td></tr>
                <tr><th>Last Updated</th><td>${data.timestamp}</td></tr>
              </table>
            `;
          } else {
            document.getElementById("device-data").innerHTML = "<p>No data found for this device.</p>";
          }
        })
        .catch(error => {
          console.error("Error fetching data:", error);
        });
    }

    // Fetch every 5 seconds
    setInterval(fetchDeviceData, 5000);
    fetchDeviceData();
  </script>
{% endblock %}
